              <option value="অন্যান্য আইনগত কারণ">অন্যান্য আইনগত বা ব্যক্তিগত কারণ</option>

            <textarea id="declineExplanation" rows="3" class="w-full border rounded-xl p-2.5 text-xs" placeholder="কেন আপনি মামলাটি পরিচালনা করতে পারছেন না তা লিখুন..."></textarea>
          </div>

          <div class="flex justify-end space-x-2 pt-2">
            <button onclick="closeModal()" class="px-4 py-2 border rounded-xl font-bold text-slate-700 hover:bg-slate-50">বাতিল</button>
            <button onclick="executeDeclineAssignment('${c.id}')" class="px-5 py-2 bg-rose-700 hover:bg-rose-800 text-white font-bold rounded-xl shadow-sm">

      }

      function executeDeclineAssignment(caseId) {
        const reason = document.getElementById("declineReasonSelect").value;
        const details = document
          .getElementById("declineExplanation")
          .value.trim();
        if (!details) {
          toast("অনুগ্রহ করে বিস্তারিত কারণ উল্লেখ করুন।");
          return;
        }
        const c = getCase(caseId);
        c.assignmentStatus = "Declined";
        c.status = "Declined";
        c.declineReason = `${reason}: ${details}`;
        logAction(
          `প্যানেল আইনজীবী কর্তৃক Case ${c.id} প্রত্যাখ্যান। কারণ: ${reason}। DLAO-কে অবহিত করা হয়েছে।`,
        );
        closeModal();
        persist();
        renderPage();
        toast(
          `মামলা ${c.id} প্রত্যাখ্যান সম্পন্ন। DLAO দপ্তরে অন্য আইনজীবী বরাদ্দের জন্য নোটিশ গেছে।`,
        );
      }

      // ==========================================
      // VIEW 3: MY CASES WORKLIST (SEARCH & FILTER)
      // ==========================================
      function viewCases() {
        return `
        <div class="bg-white rounded-2xl border border-slate-200/90 p-6 shadow-sm space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-5 border-b border-slate-200 gap-3">
            <div>
              <h2 class="text-xl font-bold text-slate-900">বরাদ্দকৃত মামলাসমূহের কার্যতালিকা</h2>
              <p class="text-xs text-slate-500 mt-0.5">আপনার পরিচালনায় থাকা সকল লিগ্যাল এইড মামলার পূর্ণাঙ্গ রোস্টার।</p>
            </div>
            <button onclick="navigate('assignments')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold px-3 py-2 rounded-xl flex items-center space-x-1.5">

              <span>অ্যাসাইনমেন্ট ইনবক্স</span>
            </button>
          </div>

          <!-- Multi-Search & Filter Toolbar -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label class="block text-[11px] font-bold text-slate-600 mb-1">মামলা খুঁজুন (Search)</label>

                <input type="text" id="caseSearchInput" oninput="applyCaseFilters()" placeholder="Case ID, মক্কেল, আদালত, বিষয়..." class="w-full border rounded-xl pl-8 pr-3 py-2 text-xs focus:ring-2 focus:ring-emerald-700 border-slate-300">

              </div>

          </div>
        </div>
      `;
      }

      function applyCaseFilters() {
        const q = (
          document.getElementById("caseSearchInput")?.value || ""
        ).toLowerCase();
        const s = document.getElementById("caseStatusFilter")?.value || "ALL";
        const p = document.getElementById("casePriorityFilter")?.value || "ALL";

        const filtered = state.cases.filter((c) => {
          const matchesQ =
            !q ||
            (
              c.id +
              " " +
              c.client +
              " " +
              c.court +
              " " +
              c.title +
              " " +
              c.matter
            )
              .toLowerCase()
              .includes(q);
          const matchesS = s === "ALL" || c.status === s;
          const matchesP = p === "ALL" || c.priority === p;
          return matchesQ && matchesS && matchesP;
        });

        const mount = document.getElementById("casesTableMount");
        if (!mount) return;

        mount.innerHTML = `
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b text-slate-600">
              <th class="p-3">মামলা নম্বর</th>
              <th class="p-3">বিষয় ও মক্কেল</th>
              <th class="p-3">আদালত / ট্রাইব্যুনাল</th>
              <th class="p-3">পরবর্তী শুনানি</th>
              <th class="p-3">অগ্রাধিকার</th>
              <th class="p-3">স্ট্যাটাস</th>
              <th class="p-3">অ্যাকশন</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
            ${
              filtered.length === 0
                ? `
              <tr><td colspan="7" class="p-6 text-center text-slate-400">কোনো মামলা পাওয়া যায়নি।</td></tr>
            `
                : filtered
                    .map(
                      (c) => `
              <tr class="hover:bg-slate-50 transition">
                <td class="p-3 font-mono font-bold text-slate-900">${c.id}</td>
                <td class="p-3">
                  <div class="font-bold text-slate-800">${c.title}</div>
                  <div class="text-slate-500 text-[11px]">${c.client} (${c.matter})</div>
                </td>
                <td class="p-3 text-slate-600">${c.court}</td>
                <td class="p-3">
                  ${c.nextHearing ? `<span class="bg-purple-50 text-purple-800 font-bold px-2 py-0.5 rounded text-[11px]">${c.nextHearing}</span>` : '<span class="text-slate-400">—</span>'}
                </td>
                <td class="p-3">
                  ${c.priority === "High" ? '<span class="bg-rose-50 text-rose-700 font-bold px-2 py-0.5 rounded border border-rose-200">High</span>' : '<span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded">Normal</span>'}
                </td>
                <td class="p-3">
                  <span class="bg-emerald-100 text-emerald-800 font-bold px-2.5 py-0.5 rounded-full text-[10px]">${c.status}</span>
                </td>
                <td class="p-3">
                  <button onclick="navigate('caseDetails', '${c.id}', 'overview')" class="bg-[#0f3322] hover:bg-[#16442f] text-white font-bold px-3 py-1.5 rounded-lg text-xs shadow-sm">
                    ফাইল খুলুন
                  </button>
                </td>
              </tr>
            `,
                    )
                    .join("")
            }
          </tbody>
        </table>
      `;
      }

          </div>
        </div>
      `;
      }

      function switchCaseTab(tabKey) {
        state.currentCaseTab = tabKey;

          btn.classList.remove("border-emerald-700", "text-emerald-800");
          btn.classList.add("border-transparent", "text-slate-500");
        });
        const active = document.getElementById("ctab-" + tabKey);
        if (active) {
          active.classList.add("border-emerald-700", "text-emerald-800");
          active.classList.remove("border-transparent", "text-slate-500");
        }
        const c = getCase(state.selectedCaseId);
        document.getElementById("caseTabContent").innerHTML =
          renderCaseTabContent(c);

      // Accessibility Handlers
      function changeFontSize(delta) {
        state.fontSizeDelta += delta;
        if (state.fontSizeDelta > 4) state.fontSizeDelta = 4;
        if (state.fontSizeDelta < -2) state.fontSizeDelta = -2;
        document.getElementById("appBody").style.fontSize =
          16 + state.fontSizeDelta + "px";
      }

      function resetFontSize() {
        state.fontSizeDelta = 0;
        document.getElementById("appBody").style.fontSize = "16px";
      }

      function toggleHighContrast() {
        state.highContrast = !state.highContrast;
        const b = document.getElementById("appBody");
        if (state.highContrast) b.classList.add("high-contrast");
        else b.classList.remove("high-contrast");
      }

      // Page renderer router
      function renderPage() {
        const container = document.getElementById("pageContainer");
        if (!container) return;

        switch (state.currentPage) {
          case "dashboard":
            container.innerHTML = viewDashboard();
            break;
          case "assignments":
            container.innerHTML = viewAssignments();
            break;
          case "cases":
            container.innerHTML = viewCases();
            applyCaseFilters();
            break;
          case "caseDetails":
            container.innerHTML = viewCaseDetails();
            break;
          case "hearings":
            container.innerHTML = viewHearings();
            break;
          case "deadlines":
            container.innerHTML = viewDeadlines();
            break;
          case "documents":
            container.innerHTML = viewDocuments();
            break;
          case "updates":
            container.innerHTML = viewUpdates();
            break;
          case "communications":
            container.innerHTML = viewCommunications();
            break;
          case "calendar":
            container.innerHTML = viewCalendar();
            break;
          case "notifications":
            container.innerHTML = viewNotifications();
            break;
          case "activity":
            container.innerHTML = viewActivityLog();
            break;
          case "profile":
            container.innerHTML = viewProfile();
            break;
          default:
            container.innerHTML = viewDashboard();
        }
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      window.addEventListener("DOMContentLoaded", () => {
        init();
        navigate("dashboard");
      });
