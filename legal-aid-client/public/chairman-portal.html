  <body

    <!-- Toast Notification Container -->
    <div
      id="toastContainer"
      class="fixed top-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"
    ></div>

    <!-- Main Application Wrapper -->
    <div class="flex h-screen overflow-hidden bg-[#f6f9ff]">
      <!-- SIDEBAR (Dark Forest Green #0f3322) -->
      <aside
        id="sidebar"
        class="fixed inset-y-0 left-0 z-40 w-72 bg-brand-900 text-white transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out flex flex-col justify-between shadow-xl"
      >
        <!-- Top Brand Header -->
        <div class="flex flex-col flex-1 overflow-y-auto custom-scrollbar">
          <div
            class="min-h-[76px] px-5 border-b border-brand-800/80 flex items-center space-x-3"
          >
            <div
              class="w-9 h-9 rounded-lg bg-orange-500 flex items-center justify-center text-white text-lg"
            >
              <i class="fa-solid fa-scale-balanced"></i>
            </div>
            <div class="min-w-0 flex-1">
              <h1 class="text-sm font-bold text-white tracking-wide truncate">
                চেয়ারম্যান পোর্টাল
              </h1>
              <p class="text-[10px] text-emerald-200/90 truncate">
                বাংলাদেশ আইনগত সহায়তা অধিদপ্তর
              </p>
            </div>
            <button
              onclick="toggleMobileSidebar()"
              class="md:hidden text-white/70 hover:text-white p-1"
            >
              <i class="fa-solid fa-xmark text-lg"></i>
            </button>
          </div>

          <!-- Navigation Menu -->
          <nav class="p-4 space-y-1 text-sm font-medium">
            <button
              onclick="switchView('dashboard')"
              id="nav-dashboard"
              class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition text-emerald-100/90 hover:bg-brand-800/70 hover:text-white"
            >
              <i class="fa-solid fa-chart-pie w-4 text-center text-sm"></i
              ><span>জেলা চিত্র (Overview)</span
              ><span
                id="badge-total-cases"
                class="hidden"
                aria-hidden="true"
              ></span>
            </button>

            <button
              onclick="switchView('officers')"
              id="nav-officers"
              class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition text-emerald-100/90 hover:bg-brand-800/70 hover:text-white"
            >
              <i class="fa-solid fa-user-shield w-4 text-center text-sm"></i
              ><span>কর্মকর্তা তদারকি (DLAO)</span
              ><span
                id="badge-officer-pending"
                class="hidden"
                aria-hidden="true"
              ></span>
            </button>

            <button
              onclick="switchView('exceptions')"
              id="nav-exceptions"
              class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition text-emerald-100/90 hover:bg-brand-800/70 hover:text-white"
            >
              <i
                class="fa-solid fa-triangle-exclamation w-4 text-center text-sm text-rose-400"
              ></i
              ><span>ব্যতিক্রম ও সতর্কতা</span
              ><span
                id="badge-exceptions"
                class="hidden"
                aria-hidden="true"
              ></span>
            </button>

            <button
              onclick="switchView('cases')"
              id="nav-cases"
              class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition text-emerald-100/90 hover:bg-brand-800/70 hover:text-white"
            >
              <i class="fa-solid fa-folder-tree w-4 text-center text-sm"></i
              ><span>মামলা ও নথিপত্র</span>
            </button>

            <button
              onclick="switchView('lawyers')"
              id="nav-lawyers"
              class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition text-emerald-100/90 hover:bg-brand-800/70 hover:text-white"
            >
              <i class="fa-solid fa-gavel w-4 text-center text-sm"></i
              ><span>প্যানেল আইনজীবী তদারকি</span>
            </button>

            <button
              onclick="switchView('mediation')"
              id="nav-mediation"
              class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition text-emerald-100/90 hover:bg-brand-800/70 hover:text-white"
            >

                class="fa-solid fa-handshake-simple w-4 text-center text-sm"
              ></i
              ><span>মধ্যস্থতা ও এডিআর</span>
            </button>

            <button
              onclick="switchView('referrals')"
              id="nav-referrals"
              class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition text-emerald-100/90 hover:bg-brand-800/70 hover:text-white"
            >
              <i
                class="fa-solid fa-arrow-up-right-from-square w-4 text-center text-sm"
              ></i
              ><span>রেফারেল ও সহযোগিতা</span>
            </button>

            <button
              onclick="switchView('meetings')"

            </button>

      function applyCaseSearchFilter() {
        const q = (
          document.getElementById("caseSearchInp")?.value || ""
        ).toLowerCase();
        const cat =
          document.getElementById("caseCategoryFilter")?.value || "ALL";
        const st = document.getElementById("caseStatusFilter")?.value || "ALL";

        const filtered = state.cases.filter((c) => {
          const matchesQ =
            !q ||
            (
              c.id +
              " " +
              c.applicant +
              " " +
              c.respondent +
              " " +
              c.type +
              " " +
              c.court +
              " " +
              c.officerName +
              " " +
              c.panelLawyer
            )
              .toLowerCase()
              .includes(q);
          const matchesCat = cat === "ALL" || c.category === cat;
          const matchesSt = st === "ALL" || c.status === st;
          return matchesQ && matchesCat && matchesSt;
        });

        const container = document.getElementById("caseTableContainer");
        if (!container) return;

        container.innerHTML = `
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-600">
              <th class="p-3">কেস নম্বর</th>
              <th class="p-3">পক্ষগণ ও বিষয়</th>
              <th class="p-3">আদালত / স্থান</th>
              <th class="p-3">কর্মকর্তা ও প্যানেল আইনজীবী</th>
              <th class="p-3">বর্তমান পর্যায়</th>
              <th class="p-3 text-center">ব্যতিক্রম সতর্কতা</th>
              <th class="p-3 text-right">অ্যাকশন</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100 font-medium">
            ${
              filtered.length === 0
                ? `
              <tr><td colspan="7" class="p-6 text-center text-slate-400">কোনো মামলা পাওয়া যায়নি।</td></tr>
            `
                : filtered
                    .map(
                      (c) => `
              <tr class="hover:bg-slate-50/70 transition">
                <td class="p-3 font-mono font-bold text-slate-900">${c.id}</td>
                <td class="p-3">
                  <div class="font-bold text-slate-900">${c.applicant} বনাম ${c.respondent}</div>
                  <div class="text-slate-500 text-[11px]">${c.type}</div>
                </td>
                <td class="p-3 text-slate-600">${c.court}</td>
                <td class="p-3">
                  <div class="text-slate-900 font-semibold">${c.officerName}</div>
                  <div class="text-slate-500 text-[11px]">${c.panelLawyer}</div>
                </td>
                <td class="p-3">
                  <span class="bg-slate-100 text-slate-800 font-bold px-2 py-0.5 rounded text-[11px]">${c.stage}</span>
                </td>
                <td class="p-3 text-center">
                  ${
                    c.exceptionType && c.exceptionType !== "none"
                      ? `
                    <span class="bg-rose-100 text-rose-800 font-bold px-2 py-0.5 rounded text-[10px] block truncate max-w-[130px] mx-auto" title="${c.exceptionType}">
                      ${c.exceptionType}
                    </span>
                  `
                      : '<span class="text-emerald-700">স্বাভাবিক</span>'
                  }
                </td>
                <td class="p-3 text-right space-x-1">
                  <button onclick="openCaseRecordModal('${c.id}')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-[11px] rounded-lg">

      function saveChairmanObservation(caseId) {
        const val = document.getElementById("directiveTextInput").value.trim();
        if (!val) {
          showToast(
            "অনুগ্রহ করে পর্যবেক্ষণ বা নির্দেশনার বিষয়বস্তু লিখুন।",
            "warning",
          );
          return;
        }
        const c = state.cases.find((x) => x.id === caseId);
        if (!c) return;

        const dateStr = new Date().toISOString().slice(0, 10);
        const note = `${dateStr}: চেয়ারম্যান মহোদয়ের নির্দেশনা: ${val}`;
        if (!c.chairmanObservations) c.chairmanObservations = [];
        c.chairmanObservations.push(note);

        // Add to audit trail
        state.auditLog.unshift({
          id: `AUD-${Date.now()}`,
          date: `${dateStr} ${new Date().toLocaleTimeString("bn-BD", { hour: "2-digit", minute: "2-digit" })}`,
          actor: "চেয়ারম্যান (জেলা ও দায়রা জজ)",
          action: `কেস ${c.id}-তে নির্দেশনা প্রদান`,
          details: val,
        });

        persistState();
        closeModal();
        renderCurrentView();
        updateSidebarBadges();
        showToast(
          `কেস ${c.id}-তে চেয়ারম্যানের নির্দেশনা সফলভাবে লিপিবদ্ধ ও কর্মকর্তার কাছে প্রেরিত হয়েছে।`,
          "success",
        );
      }

      // Toast Notification System
      function showToast(message, type = "info") {
        const container = document.getElementById("toastContainer");
        const toast = document.createElement("div");
        toast.className = `p-3.5 rounded-xl shadow-lg border text-xs font-semibold flex items-center space-x-2 transform transition duration-300 translate-y-2 pointer-events-auto ${
          type === "success"
            ? "bg-emerald-900 text-white border-emerald-700"
            : type === "warning"
              ? "bg-amber-600 text-white border-amber-500"
              : type === "error"
                ? "bg-rose-700 text-white border-rose-600"
                : "bg-slate-900 text-white border-slate-700"
        }`;
        toast.innerHTML = `
        <i class="fa-solid ${type === "success" ? "fa-circle-check text-emerald-300" : "fa-bell text-amber-300"}"></i>
        <span>${message}</span>
      `;
        container.appendChild(toast);
        setTimeout(() => {
          toast.classList.add("opacity-0", "translate-x-full");
          setTimeout(() => toast.remove(), 300);
        }, 3500);
      }

      // CSV Exporter
      function exportCurrentViewCSV() {
        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent +=
          "Case ID,Applicant,Respondent,Type,Court,Officer,Lawyer,Stage,Status\n";
        state.cases.forEach((c) => {
          csvContent += `"${c.id}","${c.applicant}","${c.respondent}","${c.type}","${c.court}","${c.officerName}","${c.panelLawyer}","${c.stage}","${c.status}"\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute(
          "download",
          `District_Legal_Aid_Joypurhat_${currentView}_Report.csv`,
        );
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("CSV রিপোর্ট ডাউনলোড সম্পন্ন হয়েছে।", "success");
      }

      // Print Report
      function printCurrentReport() {
        const printDiv = document.getElementById("printArea");
        printDiv.innerHTML = `
        <div style="font-family: 'Hind Siliguri', sans-serif; padding: 20px;">
          <div style="text-align: center; border-bottom: 2px solid #0f3322; padding-bottom: 10px; margin-bottom: 15px;">
            <h2 style="margin: 0; color: #0f3322;">জেলা লিগ্যাল এইড কমিটি, জয়পুরহাট</h2>
            <h4 style="margin: 5px 0;">বিজ্ঞ জেলা ও দায়রা জজ আদালত</h4>
            <p style="margin: 0; font-size: 12px; color: #555;">আইনগত সহায়তা প্রদান আইন, ২০০০ অনুযায়ী বিধিবদ্ধ তদারকি খতিয়ান</p>
          </div>
          <h3>${document.getElementById("topPageTitle").innerText}</h3>
          <div>${document.getElementById("viewMountPoint").innerHTML}</div>
        </div>
      `;
        window.print();
      }

      function printMeetingNotice(meetingId) {
        showToast(
          "সভার নোটিশ ও কার্যসূচি প্রিন্টারের জন্য প্রস্তুত হচ্ছে...",
          "info",
        );
        setTimeout(() => {
          printCurrentReport();
        }, 500);
      }

      // Accessibility handlers
      function changeFontSize(delta) {
        fontSizeDelta += delta;
        if (fontSizeDelta > 4) fontSizeDelta = 4;
        if (fontSizeDelta < -2) fontSizeDelta = -2;
        document.getElementById("appBody").style.fontSize =
          14.5 + fontSizeDelta + "px";
      }

      function resetFontSize() {
        fontSizeDelta = 0;
        document.getElementById("appBody").style.fontSize = "14.5px";
      }

      function refreshData() {
        renderCurrentView();
        updateSidebarBadges();
        showToast("তথ্য রিফ্রেশ ও সিঙ্ক সম্পন্ন হয়েছে।", "success");
      }

      function filterCasesByOfficer(officerId) {
        switchView("cases");
        setTimeout(() => {
          const off = state.officers.find((o) => o.id === officerId);
          if (off) {
            const inp = document.getElementById("caseSearchInp");
            if (inp) {
              inp.value = off.name;
              applyCaseSearchFilter();
            }
          }
        }, 50);
      }

      function filterExceptions(type) {
        const container = document.getElementById("exceptionCardsContainer");
        if (!container) return;
        let list = state.cases.filter(
          (c) => c.exceptionType && c.exceptionType !== "none",
        );
        if (type !== "all") {
          list = list.filter((c) => c.exceptionType === type);
        }
        container.innerHTML = list
          .map(
            (c) => `
        <div class="p-5 rounded-2xl border-2 border-rose-200 bg-rose-50/20 hover:bg-rose-50/40 transition space-y-3">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-rose-100 pb-2">
            <div class="flex items-center space-x-2.5">
              <span class="font-mono font-bold text-slate-900 text-sm">${c.id}</span>
              <span class="bg-rose-600 text-white font-bold text-[10px] px-2 py-0.5 rounded uppercase tracking-wider">${c.exceptionType}</span>
              <span class="text-xs text-slate-500">মুলতবি: <strong>${c.daysPending} দিন</strong></span>
            </div>
            <span class="text-xs text-slate-600">দায়িত্বশীল: <strong>${c.officerName}</strong></span>
          </div>
          <div class="space-y-1 text-xs">
            <h4 class="font-bold text-slate-900 text-sm">${c.applicant} বনাম ${c.respondent}</h4>
            <p class="text-slate-600">${c.type} | আদালত: ${c.court}</p>
            <div class="p-3 bg-white rounded-xl border border-rose-200 text-rose-950 font-medium leading-relaxed mt-2">
              <span class="font-bold block text-rose-800 text-[11px] mb-0.5">⚠️ সতর্কতার কারণ:</span>
              ${c.exceptionDesc}
            </div>
          </div>
          <div class="flex justify-end space-x-2 pt-2">
            <button onclick="openCaseRecordModal('${c.id}')" class="px-3.5 py-1.5 bg-white border border-slate-300 font-bold text-xs rounded-xl">নথি পর্যালোচনা</button>
            <button onclick="openObservationModal('${c.id}')" class="px-4 py-1.5 bg-brand-900 text-white font-bold text-xs rounded-xl shadow-2xs">দিকনির্দেশনা দিন</button>
          </div>
        </div>
      `,
          )
          .join("");
      }

      function showReportDetails(repKey) {
        const heading = document.getElementById("repHeading");
        const titles = {
          monthly:
            "১. মাসিক জেলা লিগ্যাল এইড সামগ্রিক অগ্রগতি প্রতিবেদন (সেপ্টেম্বর ২০২৬)",
          apps: "২. প্রাপ্ত, মঞ্জুর ও বাতিলকৃত আবেদনের তুলনামূলক পরিসংখ্যান রিপোর্ট",
          granted:
            "৩. আইনি সহায়তা প্রাপ্ত সুবিধাভোগীদের আর্থিক ও আর্থ-সামাজিক তালিকা",
          mediation:
            "৪. মধ্যস্থতা (এডিআর) সাফল্য ও দেনমোহর/ভরণপোষণ আদায় রিপোর্ট",
          lawyers: "৫. প্যানেল আইনজীবী পারফরম্যান্স মূল্যায়ন ও মামলার খতিয়ান",
          referral: "৬. ওসিসি, সমাজসেবা ও এনজিও যৌথ রেফারেল রিপোর্ট",
          overdue: "৭. বিলম্বিত ও বিশেষ কারণযুক্ত মামলার পর্যালোচনা রিপোর্ট",
          closure: "৮. চূড়ান্ত নিষ্পত্তি ও মামলা সমাপ্তি রিপোর্ট",
          committee: "৯. জেলা কমিটির রেজুলেশন বাস্তবায়ন ও মূল্যায়ন রিপোর্ট",
        };
        if (heading)
          heading.innerText = titles[repKey] || "জেলা লিগ্যাল এইড রিপোর্ট";
        showToast(`${titles[repKey]} লোড করা হয়েছে।`, "info");
      }

      // App Initialization
      window.addEventListener("DOMContentLoaded", () => {
        initState();
        switchView("dashboard");
      });
    </script>
  </body>
</html>
