  <script>
    function speakFieldText(fieldId) {
      const field = document.getElementById(fieldId);

      if (!field || !field.value.trim()) {
        return;
      }

      // Stop any previous speech
      window.speechSynthesis.cancel();

      const text = field.value.trim();
      const speech = new SpeechSynthesisUtterance(text);

      // Bengali language
      speech.lang = "bn-BD";
      speech.rate = 0.9;
      speech.pitch = 1;

      window.speechSynthesis.speak(speech);
    }
  </script>

      function go(p) {
        if (state.page === "status" && p !== "status") stopStatusCamera();
        state.page = p;
        render();
      }
      function stopStatusCamera() {
        statusCameraStream?.getTracks().forEach((track) => track.stop());
        statusCameraStream = null;
      }
      function updateStatusAccess() {
        const id = document.querySelector("#status-id");
        const consent = document.querySelector("#status-consent");
        const button = document.querySelector("#status-verify");
        if (!id || !consent || !button) return;
        button.disabled = !(
          id.value.trim() &&
          consent.checked &&
          statusCameraStream?.active
        );
        document.querySelector("#status-result").innerHTML = "";
      }
      async function startStatusCamera() {
        if (!navigator.mediaDevices?.getUserMedia) {
          note("এই ব্রাউজারে ক্যামেরা চালু করা যাচ্ছে না।");
          return;
        }
        try {
          stopStatusCamera();
          const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false,
          });
          if (state.page !== "status") {
            stream.getTracks().forEach((track) => track.stop());
            return;
          }
          statusCameraStream = stream;
          const preview = document.querySelector("#status-cam");
          if (preview) preview.srcObject = stream;
          stream
            .getVideoTracks()[0]
            ?.addEventListener("ended", updateStatusAccess);
          updateStatusAccess();
          note("ক্যামেরা চালু হয়েছে। আবেদনকারীর সম্মতি নিন।");
        } catch {
          note(
            "ক্যামেরা পাওয়া যাচ্ছে না। বিকল্প যাচাইয়ের জন্য অনুমোদিত কর্মকর্তার সহায়তা নিন।",
          );
        }
      }
      function openApp(id) {
        state.active = id;
        state.page = "intake";
        render();
      }
      function saveIntake(e) {
        e.preventDefault();
        const form = e.currentTarget;
        const value = (id) => form.querySelector(`#${id}`).value;
        let a = app();
        if (!a) {
          a = {
            id: `APP-2026-${String(125 + S.apps.length).padStart(5, "0")}`,
            docs: [],
            versions: [],
            created: stamp(),
          };
          S.apps.push(a);
          state.active = a.id;
        }
        if (a.locked) {
          note("জমা দেওয়া তথ্য পরিবর্তন করা যাবে না।");
          return;
        }
        Object.assign(a, {
          name: value("name"),
          location: value("location"),
          language: value("language"),
          bangla: value("bangla"),
          contact: value("contact"),
          safe: value("safe"),
          statement: value("original"),
          translation: value("translation"),
          status: a.status || "Draft",
        });
        a.versions.push([
          `v${a.versions.length + 1}`,
          "ইউডিসি কর্তৃক তথ্য সংযোজন",
          "খসড়া হালনাগাদ",
          stamp(),
        ]);
        audit("আবেদনের খসড়া সংরক্ষিত", a.id);
        render();
        note("তথ্যের উৎসসহ খসড়া সংরক্ষিত হয়েছে।");
      }
      async function startCamera() {
        let a = app();
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false,
          });
          let v = document.querySelector("#cam");
          v.srcObject = cameraStream;
          a.camera = true;
          audit("সম্মতির জন্য ক্যামেরা চালু", a.id);
          save();
          render();
          note("ক্যামেরা চালু হয়েছে। এবার সম্মতির ডেমো রেকর্ড তৈরি করুন।");
        } catch {
          note(
            "ক্যামেরা পাওয়া যাচ্ছে না। ডেমোর জন্য উপযুক্ত ডিভাইস বা ব্রাউজার ব্যবহার করুন।",
          );
        }
      }
      function recordConsent() {

          return;
        }
        a.recorded = true;
        a.consentRef = `CONSENT-${Date.now()}`;
        audit("সম্মতির ডেমো রেকর্ড তৈরি", a.id);
        save();
        render();
        note("সম্মতির ডেমো রেকর্ড আবেদনটির সঙ্গে যুক্ত হয়েছে।");
      }
      function giveConsent(yes) {
        let a = app();

          note("আগে ক্যামেরার মাধ্যমে সম্মতির ডেমো রেকর্ড তৈরি করুন।");

        a.status = yes ? "Document Check Pending" : "Consent Declined";

        save();
        render();
        note(
          yes
            ? "সম্মতি নথিবদ্ধ হয়েছে। প্রয়োজনীয় নথি সংযুক্ত করুন।"
            : "সম্মতি দেওয়া হয়নি; আবেদন জমা দেওয়া যাবে না।",
        );
      }
      function addDoc() {
        let a = app();
        if (!a) {
          note("প্রথমে একটি আবেদন শুরু করুন।");
          return;
        }
        let f = document.querySelector("#doc-file").files[0],
          q = document.querySelector("#doc-quality").value,
          d = {
            type: document.querySelector("#doc-type").value,
            name: f?.name || "ডেমো নথির ছবি",
            quality: q,
            time: stamp(),
          };
        a.docs.push(d);
        audit("নথি সংযুক্ত হয়েছে", `${a.id} · ${d.type} · ${q}`);
        save();
        render();
        note(
          q === "Readable"
            ? "নথিটি আবেদনের সঙ্গে যুক্ত হয়েছে।"
            : "নথির সমস্যা নথিবদ্ধ হয়েছে; কর্মকর্তার পর্যালোচনা বা পরিষ্কার ছবি প্রয়োজন।",
        );
      }
      function submitApp() {
        let a = app();
        if (!a.camera || !a.recorded || !a.consent || !a.docs.length) {
          note("আবেদন জমা দেওয়ার সব আবশ্যিক শর্ত পূরণ করুন।");
          return;
        }
        a.locked = true;
        if (S.network) {
          a.status = "Submitted";
          audit("আবেদন কেন্দ্রীয় সিস্টেমে জমা হয়েছে", a.id);
          note(`জমা হয়েছে: ${a.id}`);
        } else {
          a.status = "Offline Saved";
          let o = {
            tempId: `OFF-2026-${String(41 + S.offline.length).padStart(4, "0")}`,
            appId: a.id,
            payload: JSON.stringify(a),
          };
          S.offline.push(o);
          audit("আবেদন অফলাইনে নিরাপদে সংরক্ষিত", o.tempId);
          note(`অফলাইনে সংরক্ষিত: ${o.tempId}`);
        }
        save();
        state.page = "apps";
        render();
      }
      function verifyStatus() {
        if (
          !statusCameraStream?.active ||
          !document.querySelector("#status-consent")?.checked
        ) {
          note("আগে ক্যামেরা চালু করে আবেদনকারীর সম্মতি নিন।");
          return;
        }
        let id = document.querySelector("#status-id").value.trim(),
          a = S.apps.find((x) => x.id === id),
          out = document.querySelector("#status-result");
        if (!a) {
          out.innerHTML =
            '<div class="rounded-lg bg-rose-50 p-4 text-sm text-rose-950">ডেমো তথ্যের মধ্যে এই আবেদনটি পাওয়া যায়নি।</div>';
          return;
        }
        out.innerHTML = `<div class="rounded-lg border border-emerald-200 bg-emerald-50 p-5 text-sm"><b>আবেদনকারীর সম্মতিতে অবস্থা দেখানো হয়েছে — ডেমো</b><div class="mt-3 grid gap-2 sm:grid-cols-2"><span>আবেদন আইডি <b>${esc(a.id)}</b></span><span>অবস্থা ${badge(a.status)}</span><span>আবেদনকারী ${esc(bn(a.name))}</span><span>পরবর্তী কাজ ${a.status === "Submitted" ? "কর্মকর্তার পর্যালোচনার অপেক্ষায়" : "বাকি শর্তগুলো পূরণ করুন"}</span></div><p class="mt-4 text-xs text-emerald-950">শুধু ক্যামেরার মাধ্যমে সম্মতি নিলে পরিচয় যাচাই হয় না। বাস্তব তথ্য দেখানোর আগে অনুমোদিত পদ্ধতিতে পরিচয় নিশ্চিত করুন।</p></div>`;
        audit("আবেদনকারী ডেমোতে অবস্থা দেখতে সম্মতি দিয়েছেন", a.id);
        save();
      }
      function toggleNetwork() {
        S.network = !S.network;
        audit("সংযোগ পরিবর্তিত হয়েছে", S.network ? "Online" : "Offline");
        save();
        render();
        note(
          S.network
            ? "সংযোগ ফিরে এসেছে।"
            : "সংযোগ বিচ্ছিন্ন। আবেদন স্থানীয়ভাবে সংরক্ষিত হবে।",
        );
      }
      function syncAll() {
        if (!S.network) {
          note("সংযোগ নেই; এখন সমন্বয় করা যাবে না।");
          return;
        }
        if (!S.offline.length) {
          note("সমন্বয় করার মতো অফলাইন নথি নেই।");
          return;
        }
        S.offline.forEach((o) => {
          let a = S.apps.find((x) => x.id === o.appId);
          if (a) a.status = "Submitted";
        });
        let n = S.offline.length;
        S.offline = [];
        audit(
          "অফলাইন সারি সমন্বিত হয়েছে",
          `${n} টি নথি; একই নথির যাচাই সম্পন্ন`,
        );
        save();
        render();
        note("সমন্বয় সম্পন্ন। একই নথি দ্বিতীয়বার তৈরি হয়নি।");
      }
      function makeConflict() {
        let a = app();
        S.conflicts.push({
          offline: "আবেদনকারীর বক্তব্য: জমি নিয়ে বিরোধ",
          central: "আবেদনকারীর বক্তব্য: জমির সীমানা নিয়ে বিরোধ",
          appId: a?.id,
        });
        audit("সমন্বয়ে বিরোধ শনাক্ত", a?.id || "ডেমো");
        save();
        render();
      }
      function resolveConflict(i, r) {
        S.conflicts[i].resolved = r;
        audit("সমন্বয়ের বিরোধ নিষ্পত্তি", r);
        save();
        render();
        note("নিষ্পত্তি নিরীক্ষা ইতিহাসে নথিবদ্ধ হয়েছে।");
      }
      function clearAudit() {
        S.audit = [];
        save();
        render();
        note("ডেমো নিরীক্ষার ঘটনাগুলো মুছে দেওয়া হয়েছে।");
      }
      function resetDemo() {
        if (!confirm("ইউডিসির সব স্থানীয় ডেমো তথ্য রিসেট করবেন?")) return;
        localStorage.removeItem(KEY);
        S = structuredClone(seed);
        state = { page: "dashboard", active: S.apps[0].id, modal: null };
        render();
        note("ইউডিসির ডেমো তথ্য রিসেট হয়েছে।");
      }
      function renderModal() {
        let root = document.querySelector("#modal");
        root.innerHTML = "";
      }
      render();
    </script>
  </body>
</html>
